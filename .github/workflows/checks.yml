name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Check core and source
        run: sh scripts/check.sh
      - name: Check Python and WebAssembly
        run: sh scripts/check-bindings.sh

  reference-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild the HDF4 C fixtures and compare them with Git
        env:
          HDFOUR_FIXTURE_STORE: ${{ runner.temp }}/hdfour-fixtures
        run: |
          sh fixtures/build.sh
          git diff --exit-code -- fixtures

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the Windows file reader
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked -p hdfour

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the library minimum
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --workspace --lib
      - name: Check the development-test minimum
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 test --locked --workspace --exclude hdfour-py
