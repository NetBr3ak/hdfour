[workspace]
members = ["crates/hdfour", "crates/hdfour-py", "crates/hdfour-wasm"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NetBr3ak/hdfour"
publish = false

[workspace.dependencies]
hdfour = { path = "crates/hdfour", default-features = false }
miniz_oxide = "=0.9.1"
bytemuck = { version = "=1.25.2", features = ["must_cast"] }
pyo3 = { version = "=0.30.1", features = ["abi3-py310"] }
numpy = "=0.30.0"
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
proptest = "=1.12.0"
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
