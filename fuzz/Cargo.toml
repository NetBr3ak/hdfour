[package]
name = "hdfour-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
hdfour = { path = "../crates/hdfour" }

[workspace]
members = ["."]

[[bin]]
name = "open_read_all"
path = "fuzz_targets/open_read_all.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_deflate"
path = "fuzz_targets/codec_deflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_rle"
path = "fuzz_targets/codec_rle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "odl"
path = "fuzz_targets/odl.rs"
test = false
doc = false
bench = false
