[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "hdfour"
description = "Read-only HDF4 and HDF-EOS2 reader"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
dependencies = ["numpy>=1.23.5"]

[dependency-groups]
test = ["pytest==9.0.2", "pyhdf==0.11.7"]

[tool.maturin]
manifest-path = "crates/hdfour-py/Cargo.toml"
python-source = "python"
module-name = "hdfour._hdfour"

[tool.ruff]
line-length = 88

[tool.ruff.per-file-target-version]
"fixtures/*.py" = "py312"
