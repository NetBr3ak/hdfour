[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "hdfour"
description = "Read-only HDF4 and HDF-EOS2 reader"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
dependencies = ["numpy>=1.23.5"]

[dependency-groups]
test = [
    "maturin==1.16.0",
    "pytest==9.2.0",
    "pyhdf==0.11.7",
    "ruff==0.17.5",
]

[project.urls]
Repository = "https://github.com/NetBr3ak/hdfour"
Issues = "https://github.com/NetBr3ak/hdfour/issues"

[tool.maturin]
manifest-path = "crates/hdfour-py/Cargo.toml"
python-source = "python"
module-name = "hdfour._hdfour"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Keep the existing lint policy when Ruff expands its defaults.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.per-file-target-version]
"fixtures/*.py" = "py312"
